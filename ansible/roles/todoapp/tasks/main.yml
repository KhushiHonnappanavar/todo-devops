- name: Install Java 17 runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_name }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_name }}"
    group: "{{ app_name }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ app_jar_source }}"
    dest: "{{ app_dir }}/{{ app_name }}.jar"
    owner: "{{ app_name }}"
    group: "{{ app_name }}"
    mode: "0644"
  notify: Restart Todo API

- name: Install systemd service
  ansible.builtin.template:
    src: todoapp.service.j2
    dest: /etc/systemd/system/{{ app_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Todo API
